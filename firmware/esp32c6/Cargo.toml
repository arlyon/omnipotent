[package]
name = "omnipotent-esp32c6"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

# Keep bare-metal checks separate from the host workspace's canonical checks.
[workspace]

[[bin]]
name = "omnipotent-esp32c6"
path = "src/main.rs"
test = false
bench = false

[dependencies]
omnipotent-serve = { path = "../../crates/omnipotent-serve" }
embassy-executor = "=0.10.0"
embassy-net = { version = "=0.9.1", features = ["dhcpv4", "medium-ethernet", "tcp", "proto-ipv4"] }
embassy-time = "0.5"
esp-hal = { version = "=1.1.1", features = ["esp32c6", "unstable"] }
esp-rtos = { version = "=0.3.0", features = ["esp32c6", "esp-radio", "embassy", "esp-alloc"] }
esp-radio = { version = "=0.18.0", features = ["esp32c6", "wifi", "unstable"] }
esp-alloc = { version = "=0.10.0", features = ["esp32c6"] }
esp-backtrace = { version = "=0.19.0", features = ["esp32c6", "panic-handler", "println"] }
esp-println = { version = "=0.17.0", features = ["esp32c6"] }
esp-bootloader-esp-idf = { version = "=0.5.0", features = ["esp32c6"] }
static_cell = "2.1"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2
panic = "abort"
