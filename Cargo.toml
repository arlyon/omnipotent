[workspace]
members = ["crates/*", "bins/*"]
exclude = ["firmware/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }
zerocopy = { version = "0.8.63", default-features = false, features = ["derive"] }
