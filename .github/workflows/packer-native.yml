name: Packer binaries
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional existing omnipotent-pack-v tag to build and attach binaries to
        type: string
        default: ''
  release:
    types: [published]
permissions:
  contents: read
jobs:
  native:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'omnipotent-pack-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: linux-x86_64
            args: ''
          - runner: windows-2022
            asset: windows-x86_64.exe
            args: ''
          - runner: macos-15
            asset: macos-aarch64
            args: --no-default-features
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
      ASSET: omnipotent-pack-${{ matrix.asset }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          cache: false
          install_args: rust
      # CUDA libraries are loaded at runtime on Linux/Windows; no toolkit is needed to build.
      # Apple Silicon builds are CPU-only: embeddinggemma2-rust has no Metal backend.
      - name: Test package and chunker behaviour
        run: cargo test --locked --release -p omnipotent-pack -p omnipotent-embed -p omnipotent-wikipedia ${{ matrix.args }}
      - name: Build executable
        run: cargo build --locked --release -p omnipotent-pack ${{ matrix.args }}
      - name: Stage executable and optionally attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          binary=target/release/omnipotent-pack
          if [[ "$RUNNER_OS" == Windows ]]; then binary+=.exe; fi
          "$binary" --help
          cp "$binary" "$ASSET"
          if [[ -n "$RELEASE_TAG" ]]; then
            [[ "$RELEASE_TAG" == omnipotent-pack-v* ]] || { echo 'Unexpected release tag' >&2; exit 1; }
            [[ "$(git rev-parse HEAD)" == "$(git rev-parse "$RELEASE_TAG^{commit}")" ]] || { echo 'Release tag is not this commit' >&2; exit 1; }
            gh release upload "$RELEASE_TAG" "$ASSET"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: omnipotent-pack-${{ matrix.asset }}
          path: omnipotent-pack-${{ matrix.asset }}
