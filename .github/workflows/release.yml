name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      command:
        description: Manually retry release PR creation or publication
        type: choice
        options: [release-pr, release]
        default: release-pr
permissions: {}
jobs:
  release-plz:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.sha }}
      cancel-in-progress: false
    outputs:
      packer_tag: ${{ steps.publish.outputs.releases_created == 'true' && fromJSON(steps.publish.outputs.releases)[0].tag || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          cache: false
          install_args: rust
      - name: Publish merged release PR
        id: publish
        if: github.event_name == 'push' || inputs.command == 'release'
        uses: release-plz/action@038b3bb42de75ac07329d69e588c76d35563f038 # v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Open or update release PR
        if: inputs.command == 'release-pr' || (github.event_name == 'push' && steps.publish.outputs.releases_created != 'true')
        uses: release-plz/action@038b3bb42de75ac07329d69e588c76d35563f038 # v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
  packer-binaries:
    needs: release-plz
    if: needs.release-plz.outputs.packer_tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/packer-native.yml
    with:
      release_tag: ${{ needs.release-plz.outputs.packer_tag }}
