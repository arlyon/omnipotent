[package]
name = "omnipotent-serve"
version = "0.1.0"
description = "Portable bounded HTTP file serving over embedded-io-async"
edition.workspace = true
rust-version = "1.91"
publish.workspace = true

[dependencies]
embedded-io-async = { version = "0.7", default-features = false }
nanofish = { version = "=0.17.1", default-features = false }

[dev-dependencies]
futures-lite = "2"
