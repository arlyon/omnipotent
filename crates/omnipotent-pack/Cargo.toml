[package]
name = "omnipotent-pack"
version = "0.1.0"
description = "Prepare, embed, merge and finalise offline knowledge packages"
edition.workspace = true
rust-version = "1.91"
publish.workspace = true

[features]
default = ["cuda"]
cuda = ["omnipotent-embed/cuda"]

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
omnipotent-embed = { path = "../omnipotent-embed" }
omnipotent-format = { path = "../omnipotent-format", features = ["storage"] }
omnipotent-wikipedia = { path = "../omnipotent-wikipedia" }
serde = { workspace = true, features = ["std"] }
serde_json = "1"
shodh-redb = { path = "../../vendor/shodh-redb", default-features = false, features = ["std"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
tempfile = "3"
