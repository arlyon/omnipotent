[package]
name = "omnipotent-linux"
version = "0.1.0"
description = "Linux file:// and Tokio bindings for Omnipotent's embedded-io HTTP core"
edition.workspace = true
rust-version = "1.91"
publish.workspace = true

[dependencies]
embedded-io-adapters = { version = "0.7", features = ["tokio-1"] }
embedded-io-async = "0.7"
omnipotent-serve = { path = "../omnipotent-serve" }
omnipotent-format = { path = "../omnipotent-format" }
serde_json = "1"
nanofish = { version = "=0.17.1", default-features = false }
rustix = { version = "1", features = ["fs"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "fs", "io-util", "sync", "time", "signal", "macros"] }

[dev-dependencies]
tempfile = "3"
omnipotent-pack = { path = "../omnipotent-pack" }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
