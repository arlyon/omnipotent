[package]
name = "omnipotent-storage-tests"
version = "0.1.0"
description = "Conformance tests for Omnipotent's patched storage dependency"
edition.workspace = true
rust-version = "1.89"
publish.workspace = true

[features]
default = ["std"]
std = ["shodh-redb/std"]

[dependencies]
omnipotent-format = { path = "../omnipotent-format", features = ["storage"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
shodh-redb = { path = "../../vendor/shodh-redb", default-features = false }

[dev-dependencies]
sha2 = { version = "0.10", default-features = false }
